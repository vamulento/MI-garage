<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Garage</title>
<meta name="theme-color" content="#0B2A7A">
<meta name="description" content="Mantenimiento y gastos de tus vehículos: ITV, seguro, taller y combustible.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Garage">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a blue gradient header card (brand, tabs, session) over a light-blue canvas; bottom tab bar on phones; panels in one column that open to two on desktop. */
:root{
  --bg:#E8EFFB; --panel:#FFFFFF; --panel2:#F0F5FD; --ink:#0E1A33; --muted:#546682; --line:#D0DCF0;
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --accent-soft:#DFE8FD; --hero1:#0B2A7A; --hero2:#2B64F0;
  --ok:#1E7A45; --ok-bg:#DDF2E6; --warn:#955700; --warn-bg:#FFEFCC; --bad:#B42323; --bad-bg:#FCE1E1;
  --c-fuel:#D98A00; --c-taller:#1F4FD8; --c-seguro:#7A4BD6; --c-itv:#1E8A4C; --c-tax:#0E8FA3; --c-otros:#7C8794;
  --plate-bg:#FFFFFF; --plate-ink:#111; --plate-edge:#1B3A9E; --shadow:0 6px 24px rgba(15,40,110,.10);
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif; --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08111F; --panel:#0F1C33; --panel2:#152643; --ink:#E7EEFB; --muted:#92A4C4; --line:#213559;
  --accent:#6C97FF; --accent-ink:#071127; --accent-soft:#17274A; --hero1:#0C1F55; --hero2:#1F4FD8;
  --ok:#4CC38A; --ok-bg:#12301F; --warn:#F2B14A; --warn-bg:#352708; --bad:#FF8A8A; --bad-bg:#3A1717;
  --c-fuel:#F2B14A; --c-taller:#6C97FF; --c-seguro:#B08CFF; --c-itv:#4CC38A; --c-tax:#46C7DA; --c-otros:#8E99A6;
  --plate-bg:#F1F3F5; --plate-edge:#2B4FC4; --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08111F; --panel:#0F1C33; --panel2:#152643; --ink:#E7EEFB; --muted:#92A4C4; --line:#213559;
  --accent:#6C97FF; --accent-ink:#071127; --accent-soft:#17274A; --hero1:#0C1F55; --hero2:#1F4FD8;
  --ok:#4CC38A; --ok-bg:#12301F; --warn:#F2B14A; --warn-bg:#352708; --bad:#FF8A8A; --bad-bg:#3A1717;
  --c-fuel:#F2B14A; --c-taller:#6C97FF; --c-seguro:#B08CFF; --c-itv:#4CC38A; --c-tax:#46C7DA; --c-otros:#8E99A6;
  --plate-bg:#F1F3F5; --plate-edge:#2B4FC4; --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);min-height:100vh}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:1.6rem;line-height:1.1}
h3{font-size:1.1rem;line-height:1.15;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.shell{max-width:1080px;margin:0 auto}
a{color:var(--accent)}

/* header */
.top{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:20;margin-top:10px;background:linear-gradient(110deg,var(--hero1),var(--hero2));color:#fff;border-radius:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:10px 14px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.55rem;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:9px;margin-right:auto}
.brand .mark{width:46px;height:30px;border-radius:9px;background:#F2F7FA;display:grid;place-items:center}
.brand .mark svg{width:34px;height:auto}
.logo{background:#fff;border-radius:22px;padding:18px 16px 16px;box-shadow:var(--shadow);text-align:center}
.logo svg{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
.trace-line{stroke-dasharray:600;stroke-dashoffset:600;animation:drawEffect 4s ease-in-out infinite}
@keyframes drawEffect{0%{stroke-dashoffset:600}50%{stroke-dashoffset:0}100%{stroke-dashoffset:-600}}
@media (prefers-reduced-motion:reduce){.trace-line{animation:none;stroke-dashoffset:0}}
.who{font-size:.85rem;display:flex;align-items:center;gap:10px;min-width:0;color:rgba(255,255,255,.85)}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:30vw}
.who .linkbtn{color:#fff}
.badge-demo{background:#FFE3A3;color:#6B4200;font-weight:600;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:5px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);display:flex;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));gap:4px}
.nav button{flex:1;border:0;background:transparent;padding:8px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.76rem;font-weight:500;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
main{padding-block:20px 120px;display:grid;gap:20px}
@media (min-width:820px){
  .nav{position:static;border:0;background:transparent;padding:0;margin-left:8px;gap:2px}
  .nav button{flex:none;flex-direction:row;padding:8px 14px;font-size:.95rem;gap:8px;color:rgba(255,255,255,.8)}
  .nav button svg{width:18px;height:18px}
  .nav button[aria-current="page"]{background:rgba(255,255,255,.18);color:#fff}
  main{padding-bottom:60px}
}

/* generic */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.grid2{display:grid;gap:20px;grid-template-columns:1fr}
.grid3{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
@media (min-width:900px){.grid2{grid-template-columns:1.1fr .9fr}}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 16px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,border-color .15s,box-shadow .15s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(110deg,var(--hero1),var(--hero2));color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(31,79,216,.35)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--accent-ink)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.55;cursor:default}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:.9rem;font-weight:500;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.tag::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--tc,var(--c-otros))}
.t-combustible{--tc:var(--c-fuel)}.t-taller{--tc:var(--c-taller)}.t-seguro{--tc:var(--c-seguro)}.t-itv{--tc:var(--c-itv)}.t-impuesto{--tc:var(--c-tax)}.t-otros{--tc:var(--c-otros)}
.pill{display:inline-block;font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--panel2);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}

/* plate */
.plate{display:inline-flex;align-items:stretch;border:2px solid var(--plate-ink);border-radius:6px;background:var(--plate-bg);color:var(--plate-ink);overflow:hidden;font-family:var(--f-mono);font-weight:500;line-height:1}
.plate i{background:var(--plate-edge);color:#fff;font-style:normal;font-size:.6em;padding:4px 5px;display:grid;place-items:end center;font-family:var(--f-body);font-weight:600}
.plate b{font-weight:500;padding:5px 9px;letter-spacing:.08em;font-size:1em}
.plate.big{font-size:1.5rem}

/* gate */
.gate{max-width:480px;margin:7vh auto 0;display:grid;gap:22px}
.gate .hero{background:linear-gradient(120deg,var(--hero1),var(--hero2));color:#fff;border-radius:22px;padding:28px 24px;display:grid;gap:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.gate .hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.gate h1{font-size:clamp(2.4rem,9vw,3.4rem);line-height:.95;text-transform:uppercase}
.gate .lead{color:rgba(255,255,255,.85);max-width:40ch}
.gate form{display:grid;gap:14px}
.gate ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;color:var(--muted);font-size:.93rem}
.gate li{display:flex;gap:10px}.gate li svg{flex:none;width:18px;height:18px;margin-top:2px;color:var(--accent)}

/* reminders */
.rem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.rem:first-of-type{border-top:0}
.rem .days{font-family:var(--f-display);font-weight:700;font-size:1.7rem;line-height:1;min-width:3.4ch;text-align:center}
.rem.bad .days{color:var(--bad)}.rem.warn .days{color:var(--warn)}.rem.ok .days{color:var(--ok)}
.rem .what{min-width:0}
.rem .what b{display:block;overflow-wrap:anywhere}
.rem .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:22px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center;display:grid;gap:12px;justify-items:center}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.kpi{display:grid;gap:2px}
.kpi .v{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1.05}
.kpi .l{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:500 10px var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px}
.cat{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:.95rem}
.cat .bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.cat .bar span{display:block;height:100%;background:var(--tc);border-radius:4px}

/* vehicle cards */
.vcard{display:grid;gap:12px;text-align:left;width:100%;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
.vcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.vcard h3{color:var(--ink);text-transform:none;font-size:1.5rem;letter-spacing:.01em}
.vadd{border:1.5px dashed var(--line);background:transparent;border-radius:16px;min-height:170px;display:grid;place-items:center;color:var(--muted);font-weight:600;gap:6px;align-content:center}
.vadd:hover{color:var(--accent);border-color:var(--accent)}

/* spec table */
.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px 20px}
.specs div{padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.specs dt{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.specs dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.specs dd.none{color:var(--muted);font-weight:400}

/* records */
.rec{display:grid;grid-template-columns:1fr auto;gap:4px 12px;width:100%;text-align:left;border:0;background:transparent;border-top:1px solid var(--line);padding:12px 0}
.rec:first-child{border-top:0}
.rec:hover .t{color:var(--accent)}
.rec .t{font-weight:600;overflow-wrap:anywhere}
.rec .amt{font-family:var(--f-display);font-size:1.3rem;font-weight:700;text-align:right}
.rec .sub{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;color:var(--muted);align-items:center}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sel{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 12px;min-height:40px}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(5,12,30,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border:1px solid var(--line);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:640px){.veil{align-items:center}.sheet{border-radius:20px;padding:24px}}
.sheet form{display:grid;gap:14px;margin-top:14px}
.f{display:grid;gap:5px;min-width:0}
.f label,.f .lab{font-size:.8rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent)}
.f textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.two:not(.keep){grid-template-columns:1fr}}
.types{display:flex;flex-wrap:wrap;gap:8px}
.check{display:flex;gap:10px;align-items:center;min-height:44px}
.check input{width:20px;height:20px;min-height:0}
details.more{border:1px solid var(--line);border-radius:14px;padding:10px 14px}
details.more summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
details.more .two{margin-top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-weight:500;max-width:90vw}
@media (min-width:820px){.toast{bottom:28px}}
.note{background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:.88rem;color:var(--muted)}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em}
.setrow{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sheetup{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,10px)}}
@media (prefers-reduced-motion:no-preference){
  .anim main>*,.anim .gate>*{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
  .anim main>*:nth-child(2),.anim .gate>*:nth-child(2){animation-delay:.07s}
  .anim main>*:nth-child(3),.anim .gate>*:nth-child(3){animation-delay:.14s}
  .anim main>*:nth-child(4){animation-delay:.21s}
  .anim main>*:nth-child(5){animation-delay:.28s}
  .anim .grid3>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
  .anim .grid3>*:nth-child(2){animation-delay:.06s}.anim .grid3>*:nth-child(3){animation-delay:.12s}.anim .grid3>*:nth-child(4){animation-delay:.18s}
  .anim .rem{animation:rise .45s both}
  .anim .rem:nth-of-type(2){animation-delay:.08s}.anim .rem:nth-of-type(3){animation-delay:.16s}.anim .rem:nth-of-type(4){animation-delay:.24s}
  .anim .chart rect{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.7,.2,1) both .15s}
  .anim .cat .bar span{transform-origin:left;animation:growx .9s cubic-bezier(.2,.7,.2,1) both .25s}
  .sheet{animation:sheetup .28s ease both}.veil{animation:fade .2s both}
  .gate .hero::after{animation:drift 9s ease-in-out infinite}
  .top{animation:fade .4s both}
}
</style>
</head>
<body>
<div class="shell" id="root"></div>
<div id="sheetRoot"></div>
<div id="toastRoot" aria-live="polite"></div>
<input type="file" id="impFile" accept=".json,application/json" hidden>

<script>
(function(){
"use strict";
var TYPES={combustible:"Combustible",taller:"Taller",seguro:"Seguro",itv:"ITV",impuesto:"Impuesto",otros:"Otros"};
var TYPE_ORDER=["combustible","taller","seguro","itv","impuesto","otros"];
var FUELS=["Gasolina","Diésel","Híbrido","Híbrido enchufable","Eléctrico","GLP","GNC"];
var VTYPES=["Coche","Moto","Furgoneta","Otro"];
var TECH=[["vin","Nº de bastidor (VIN)"],["matric","Primera matriculación"],["cv","Potencia (CV)"],["kw","Potencia (kW)"],["cc","Cilindrada (cc)"],["cil","Cilindros"],["trans","Transmisión"],["tank","Depósito / batería"],["tires","Neumáticos"],["oil","Aceite motor"],["weight","Peso (kg)"],["label","Etiqueta ambiental"],["co2","CO₂ (g/km)"],["seats","Plazas"]];
var KEY="garage.v1",AUTH="garage.auth",REM="garage.remember",SESS="garage.sess",APIKEY="garage.apikey";
var RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
var S={mode:"boot",demo:false,name:"",vehicles:[],records:[],settings:{},tab:"resumen",vid:null,fv:"all",ft:"all",draft:null,sheet:null,pending:null,anim:false,authErr:""};

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function $(id){return document.getElementById(id)}
var eur=new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"});
function money(n){return eur.format(n||0)}
function numfmt(n,d){return new Intl.NumberFormat("es-ES",{maximumFractionDigits:d==null?0:d,minimumFractionDigits:d==null?0:d}).format(n)}
function iso(d){var m=d.getMonth()+1,day=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day}
function today(){var d=new Date();d.setHours(0,0,0,0);return d}
function daysUntil(s){var p=s.split("-");return Math.round((new Date(+p[0],+p[1]-1,+p[2])-today())/864e5)}
function fdate(s){if(!s)return "";var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("es-ES",{day:"numeric",month:"short",year:"numeric"})}
function num(s){if(s==null||s==="")return null;var n=parseFloat(String(s).replace(/\s/g,"").replace(",","."));return isFinite(n)?n:null}
function r2(n){return Math.round(n*100)/100}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}

function load(){
  try{var j=JSON.parse(localStorage.getItem(KEY)||"null");if(j){S.vehicles=j.vehicles||[];S.records=j.records||[];S.settings=j.settings||{}}}catch(e){}
}
function persist(){
  if(S.demo)return;
  try{localStorage.setItem(KEY,JSON.stringify({vehicles:S.vehicles,records:S.records,settings:S.settings}))}
  catch(e){toast("No se pudo guardar en este navegador. Revisa el modo privado o el espacio")}
}
function clean(o){var r={};Object.keys(o).forEach(function(k){if(o[k]!==undefined&&o[k]!==null&&o[k]!=="")r[k]=o[k]});return r}
function saveItem(kind,obj){
  var list=kind==="vehicles"?S.vehicles:S.records;
  var n=clean(obj);n.id=obj.id||uid();
  var i=list.findIndex(function(x){return x.id===n.id});
  if(i>=0)list[i]=n;else list.push(n);
  persist();render();return n.id;
}
function delItem(kind,id){
  if(kind==="vehicles")S.vehicles=S.vehicles.filter(function(x){return x.id!==id});
  else S.records=S.records.filter(function(x){return x.id!==id});
  persist();
}

/* ---------- auth (local) ---------- */
function toHex(u){return Array.prototype.map.call(u,function(b){return ("0"+b.toString(16)).slice(-2)}).join("")}
function fromHex(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a}
function weak(s){var h1=0xdeadbeef,h2=0x41c6ce57;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (h2>>>0).toString(16)+(h1>>>0).toString(16)}
async function hashPw(pw,salt){
  if(window.crypto&&crypto.subtle){
    var k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
    var b=await crypto.subtle.deriveBits({name:"PBKDF2",salt:fromHex(salt),iterations:150000,hash:"SHA-256"},k,256);
    return "p:"+toHex(new Uint8Array(b));
  }
  return "w:"+weak(salt+pw+salt);
}
function getAuth(){try{return JSON.parse(localStorage.getItem(AUTH)||"null")}catch(e){return null}}
function newSalt(){var a=new Uint8Array(16);crypto.getRandomValues(a);return toHex(a)}
async function submitAuth(){
  var a=getAuth(),pw=$("a-pass").value,rem=$("a-rem")&&$("a-rem").checked;
  S.authErr="";
  try{
    if(!a){
      var nm=$("a-name").value.trim(),pw2=$("a-pass2").value;
      if(pw.length<6){S.authErr="La contraseña debe tener al menos 6 caracteres.";render();return}
      if(pw!==pw2){S.authErr="Las contraseñas no coinciden.";render();return}
      var salt=newSalt(),h=await hashPw(pw,salt);
      localStorage.setItem(AUTH,JSON.stringify({name:nm,salt:salt,hash:h}));
      S.name=nm;
    }else{
      var hh=await hashPw(pw,a.salt);
      if(hh!==a.hash){S.authErr="Contraseña incorrecta.";render();return}
      S.name=a.name||"";
    }
    try{if(rem)localStorage.setItem(REM,"1");sessionStorage.setItem(SESS,"1")}catch(e){}
    enter();
  }catch(e){S.authErr="No se pudo guardar el acceso en este navegador.";render()}
}

/* ---------- reminders & stats ---------- */
function recsOf(vid){return S.records.filter(function(r){return r.vid===vid})}
function planItems(v){return (v.plan||[]).map(function(p){return {v:v,type:"taller",km:true,kmLeft:p.km-(v.km||0),nextKm:p.km,label:p.t,pid:p.id}})}
function remindersFor(v){
  var out=[],rs=recsOf(v.id);
  ["itv","seguro","impuesto"].forEach(function(t){
    var list=rs.filter(function(r){return r.type===t&&r.expires}).sort(function(a,b){return b.expires.localeCompare(a.expires)});
    if(list[0])out.push({v:v,type:t,rec:list[0],date:list[0].expires,days:daysUntil(list[0].expires),amount:list[0].amount});
    else out.push({v:v,type:t,missing:true});
  });
  var tl=rs.filter(function(r){return r.type==="taller"&&r.expires}).sort(function(a,b){return b.date.localeCompare(a.date)})[0];
  if(tl)out.push({v:v,type:"taller",rec:tl,date:tl.expires,days:daysUntil(tl.expires),amount:tl.amount,label:"Próxima revisión"});
  return out;
}
function level(r){
  if(r.missing)return "none";
  if(r.km)return r.kmLeft<0?"bad":r.kmLeft<=1500?"warn":"ok";
  return r.days<0?"bad":r.days<=30?"warn":"ok";
}
function allAlerts(){
  var a=[];
  S.vehicles.forEach(function(v){
    remindersFor(v).forEach(function(r){var l=level(r);if(l==="bad"||l==="warn"||(l==="ok"&&r.days<=60))a.push(r)});
    planItems(v).forEach(function(r){var l=level(r);if(l==="bad"||l==="warn")a.push(r)});
  });
  return a.sort(function(x,y){var dx=x.km?x.kmLeft/40:x.days,dy=y.km?y.kmLeft/40:y.days;return dx-dy});
}
function stats(vid){
  var rs=vid?recsOf(vid):S.records;
  var total=0,ytd=0,iva=0,yr=String(new Date().getFullYear());
  rs.forEach(function(r){total+=r.amount||0;if(r.date&&r.date.slice(0,4)===yr){ytd+=r.amount||0;iva+=ivaOf(r)}});
  var o={total:total,ytd:ytd,iva:iva,price:null,cons:null,perKm:null};
  var fuel=rs.filter(function(r){return r.type==="combustible"&&r.liters>0});
  var fl=0,fa=0;fuel.forEach(function(r){fl+=r.liters;fa+=r.amount||0});
  if(fl>0)o.price=fa/fl;
  var wk=fuel.filter(function(r){return r.km!=null}).sort(function(a,b){return a.km-b.km});
  if(wk.length>=2){var lit=0;for(var i=1;i<wk.length;i++)lit+=wk[i].liters;var d=wk[wk.length-1].km-wk[0].km;if(d>0)o.cons=lit/d*100}
  var kms=rs.filter(function(r){return r.km!=null}).map(function(r){return r.km});
  if(kms.length>=2){var span=Math.max.apply(null,kms)-Math.min.apply(null,kms);if(span>200)o.perKm=total/span}
  return o;
}
function monthly(){
  var now=new Date(),m=[];
  for(var i=11;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1);m.push({key:d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2),label:d.toLocaleDateString("es-ES",{month:"short"}).replace(".",""),by:{},sum:0})}
  var idx={};m.forEach(function(x,i){idx[x.key]=i});
  S.records.forEach(function(r){if(!r.date)return;var k=r.date.slice(0,7);if(idx[k]==null)return;var b=m[idx[k]];b.by[r.type]=(b.by[r.type]||0)+(r.amount||0);b.sum+=r.amount||0});
  return m;
}
function niceMax(v){if(v<=0)return 100;var p=Math.pow(10,Math.floor(Math.log10(v)));var n=v/p;var s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return s*p}
var COLORVAR={combustible:"--c-fuel",taller:"--c-taller",seguro:"--c-seguro",itv:"--c-itv",impuesto:"--c-tax",otros:"--c-otros"};
function chartSVG(){
  var m=monthly(),W=380,H=196,L=44,B=24,T=10,R=6,ph=H-B-T,pw=W-L-R;
  var max=niceMax(Math.max.apply(null,m.map(function(x){return x.sum})));
  var slot=pw/12,bw=slot*0.62,s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gasto mensual de los últimos 12 meses">';
  [0,.5,1].forEach(function(f){var y=T+ph-ph*f;s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+3)+'" text-anchor="end">'+numfmt(max*f)+' €</text>'});
  m.forEach(function(x,i){
    var cx=L+slot*i+(slot-bw)/2,y=T+ph;
    TYPE_ORDER.forEach(function(t){var v=x.by[t];if(!v)return;var h=v/max*ph;y-=h;s+='<rect x="'+cx.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(h,1).toFixed(1)+'" rx="2" style="fill:var('+COLORVAR[t]+')"/>'});
    s+='<text x="'+(cx+bw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(x.label)+'</text>';
  });
  return s+'</svg>';
}
function cnt(n,fmt){
  var txt=fmt==="money"?money(n):fmt==="int"?numfmt(n):fmt==="d1"?numfmt(n,1):fmt==="d2"?numfmt(n,2):numfmt(n,3);
  return '<span data-count="'+n+'" data-fmt="'+fmt+'">'+txt+'</span>';
}
function runCounts(){
  if(RM)return;
  document.querySelectorAll("[data-count]").forEach(function(el){
    var to=+el.getAttribute("data-count"),f=el.getAttribute("data-fmt"),t0=performance.now(),D=850;
    function fmt(v){return f==="money"?money(v):f==="int"?numfmt(v):f==="d1"?numfmt(v,1):f==="d2"?numfmt(v,2):numfmt(v,3)}
    function step(t){var p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=fmt(to*e);if(p<1)requestAnimationFrame(step)}
    el.textContent=fmt(0);requestAnimationFrame(step);
  });
}

function readRec(){
  var r=S.draft.r,g=function(id){var e=$(id);return e?e.value:undefined};
  var o={type:r.type,vid:g("f-vid")||r.vid,date:g("f-date"),km:num(g("f-km")),amount:num(g("f-amount")),notes:(g("f-notes")||"").trim()};
  var t=r.type;
  if(t==="combustible"){o.liters=num(g("f-liters"));o.price=num(g("f-price"));o.station=(g("f-station")||"").trim();o.full=$("f-full")?$("f-full").checked:false}
  if(t==="taller"){o.workshop=(g("f-workshop")||"").trim();o.title=(g("f-title")||"").trim();o.labor=num(g("f-labor"));o.parts=num(g("f-parts"));o.expires=g("f-expires");o.nextKm=num(g("f-nextkm"))}
  if(t==="seguro"){o.company=(g("f-company")||"").trim();o.policy=(g("f-policy")||"").trim();o.cover=(g("f-cover")||"").trim();o.expires=g("f-expires")}
  if(t==="itv"){o.station=(g("f-station")||"").trim();o.result=g("f-result");o.expires=g("f-expires")}
  if(t==="impuesto"){o.title=(g("f-title")||"").trim();o.expires=g("f-expires")}
  if(t==="otros"){o.title=(g("f-title")||"").trim()}
  if($("f-iva")){o.iva=num(g("f-iva"));o.ded=$("f-ded").checked}
  return o;
}
function submitRec(){
  var o=readRec();
  if(!o.vid){toast("Añade primero un vehículo");return}
  if(!o.date){toast("Indica la fecha");return}
  if(o.amount==null||o.amount<0){toast("Indica el importe");return}
  var nextKm=o.nextKm;delete o.nextKm;
  if(S.draft.id)o.id=S.draft.id;
  saveItem("records",o);
  var v=veh(o.vid);
  if(v){
    var nv=Object.assign({},v),ch=false;
    if(o.km!=null&&(v.km==null||o.km>v.km)){nv.km=o.km;ch=true}
    if(S.draft.planId){nv.plan=(nv.plan||[]).filter(function(p){return p.id!==S.draft.planId});ch=true}
    if(nextKm!=null&&!S.draft.id){nv.plan=(nv.plan||[]).concat([{id:uid(),t:o.title||"Revisión",km:nextKm}]);ch=true}
    if(ch)saveItem("vehicles",nv);
  }
  closeSheet();toast("Guardado");
}

/* ---------- plate lookup (apivehiculo.com, user's own key) ---------- */
function getKey(){try{return localStorage.getItem(APIKEY)||""}catch(e){return ""}}
async function lookupPlate(plate){
  var key=getKey();if(!key)return {err:"nokey"};
  var ctl=new AbortController(),to=setTimeout(function(){ctl.abort()},15000);
  try{
    var res=await fetch("https://api.apivehiculo.com/v1/vehicles/lookup?plate="+encodeURIComponent(plate)+"&country=ES",{headers:{Authorization:"Bearer "+key,Accept:"application/json"},signal:ctl.signal});
    clearTimeout(to);
    if(res.status===401||res.status===403)return {err:"auth"};
    if(res.status===404)return {err:"notfound"};
    if(res.status===402||res.status===429)return {err:"quota"};
    var j=await res.json().catch(function(){return null});
    if(!res.ok||!j||!j.data)return {err:"other",msg:(j&&j.message)||("Error "+res.status)};
    return {data:j.data};
  }catch(e){clearTimeout(to);return {err:"net"}}
}
function lookupMsg(r){
  return {nokey:"Falta la clave de la consulta.",auth:"La clave no es válida o ha caducado.",notfound:"No se han encontrado datos para esa matrícula.",quota:"Se han agotado las consultas de tu plan.",net:"No se pudo conectar. Revisa la conexión o puede que el servicio no permita la consulta desde el navegador.",other:r.msg}[r.err]||"No se pudo consultar.";
}
function mapFuel(s){
  var t=String(s||"").toLowerCase();
  if(/plug|enchuf|phev/.test(t))return "Híbrido enchufable";
  if(/hybrid|h[íi]brid/.test(t))return "Híbrido";
  if(/electr/.test(t))return "Eléctrico";
  if(/diesel|di[ée]sel|gasoil/.test(t))return "Diésel";
  if(/lpg|glp/.test(t))return "GLP";
  if(/cng|gnc|natural/.test(t))return "GNC";
  if(/gasol|petrol|nafta/.test(t))return "Gasolina";
  return "";
}
function mapLookup(d){
  var o={},tech={};
  function s(v){return v==null||typeof v==="object"?"":String(v).trim()}
  o.brand=s(d.brand);o.model=s(d.model);o.version=s(d.version);
  var fr=s(d.firstRegistrationDate);
  if(fr){o.year=parseInt(fr.slice(0,4),10)||"";tech.matric=/^\d{4}-\d{2}-\d{2}/.test(fr)?fdate(fr.slice(0,10)):fr}
  o.fuel=mapFuel(d.fuelType);
  if(s(d.powerKW))tech.kw=s(d.powerKW)+" kW";
  if(s(d.powerHP))tech.cv=s(d.powerHP)+" CV";
  var rules=[["vin",/vin|bastidor|chassis/],["cc",/displacement|cilindrada|cubic|capacity/],["cil",/cylinder|cilindros/],["trans",/transmission|gearbox|cambio/],["co2",/co2/],["seats",/seats|plazas/],["weight",/weight|peso|mass/],["label",/environmental|distintivo|etiqueta/]];
  Object.keys(d).forEach(function(k){
    var v=s(d[k]);if(!v)return;var lk=k.toLowerCase();
    rules.forEach(function(r){if(!tech[r[0]]&&r[1].test(lk)){tech[r[0]]=(r[0]==="cc"&&/^\d+$/.test(v))?v+" cc":v}});
  });
  return {main:o,tech:tech};
}
function openKeySheet(){
  openSheet(head("Consulta por matrícula")+'<p style="margin-top:12px">Para rellenar la ficha a partir de la matrícula, la app usa el servicio <a href="https://apivehiculo.com/" target="_blank" rel="noopener">apivehiculo.com</a>. Regístrate allí, copia tu clave y pégala aquí. La clave se guarda solo en este dispositivo y no se incluye en las copias de seguridad.</p>'+
   '<p class="note" style="margin-top:12px">El servicio tiene coste: la prueba gratuita incluye una consulta por usuario y los planes de pago parten de 6 €/mes. Consulta las condiciones en su <a href="https://apivehiculo.com/precios" target="_blank" rel="noopener">página de precios</a>.</p>'+
   '<form id="kf" novalidate><div class="f"><label for="k-key">Clave de acceso</label><input id="k-key" type="password" autocomplete="off" value="'+esc(getKey())+'" placeholder="av_…"></div>'+
   '<div class="row between"><div class="row">'+(getKey()?'<button type="button" class="btn danger" data-act="delkey">Quitar clave</button>':'')+'</div><div class="row"><button type="button" class="btn" data-act="close">Cancelar</button><button type="submit" class="btn primary">Guardar</button></div></div></form>');
}
async function lookupInForm(btn){
  var plate=$("f-plate").value.toUpperCase().replace(/[\s-]/g,""),msg=$("lk-msg");
  if(plate.length<4){toast("Escribe primero la matrícula");return}
  if(!getKey()){openKeySheet();return}
  btn.disabled=true;btn.textContent="Buscando…";msg.textContent="";
  var r=await lookupPlate(plate);
  btn.disabled=false;btn.textContent="Buscar datos por matrícula";
  if(r.err){msg.textContent=lookupMsg(r);return}
  var m=mapLookup(r.data),n=0;
  function put(id,v){var e=$(id);if(e&&v!==""&&v!=null&&!e.value){e.value=v;n++}}
  put("f-brand",m.main.brand);put("f-model",m.main.model);put("f-version",m.main.version);put("f-year",m.main.year);put("f-fuel",m.main.fuel);
  Object.keys(m.tech).forEach(function(k){put("t-"+k,m.tech[k])});
  var det=document.querySelector("details.more");if(det&&Object.keys(m.tech).length)det.open=true;
  if(S.draft)S.draft.lookedUp=true;
  msg.textContent=n?"Datos encontrados ("+n+" campos). Revísalos y pulsa Guardar.":"La consulta no ha aportado datos nuevos.";
}
async function lookupSaved(id,btn){
  var v=veh(id);if(!v||!v.plate){toast("Este vehículo no tiene matrícula");return}
  if(!getKey()){openKeySheet();return}
  btn.disabled=true;btn.textContent="Buscando…";
  var r=await lookupPlate(v.plate);
  if(r.err){btn.disabled=false;btn.textContent="Completar por matrícula";toast(lookupMsg(r));return}
  var m=mapLookup(r.data),nv=Object.assign({},v),n=0;
  Object.keys(m.main).forEach(function(k){if(m.main[k]!==""&&!nv[k]){nv[k]=m.main[k];n++}});
  Object.keys(m.tech).forEach(function(k){if(!nv[k]){nv[k]=m.tech[k];n++}});
  if(n)nv.techSource="matricula";
  saveItem("vehicles",nv);toast(n?n+" datos completados. Revísalos":"La consulta no ha aportado datos nuevos");
}

/* ---------- import / export ---------- */
function download(name,text,mime){var b=new Blob([text],{type:mime});var u=URL.createObjectURL(b);var a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1500)}
function exportJSON(){
  S.settings.lastBackup=iso(new Date());persist();
  download("mi-garage-"+iso(new Date())+".json",JSON.stringify({app:"mi-garage",version:1,exported:new Date().toISOString(),vehicles:S.vehicles,records:S.records,settings:S.settings},null,1),"application/json");
  toast("Copia descargada");render();
}
function csvCell(v){var s=String(v==null?"":v);return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function exportCSV(){
  var rows=[["Fecha","Vehículo","Matrícula","Tipo","Concepto","Taller o lugar","Km","Cantidad","Precio unidad","Importe","IVA deducible","Vence","Notas"]];
  S.records.slice().sort(function(a,b){return (a.date||"").localeCompare(b.date||"")}).forEach(function(r){
    var v=veh(r.vid)||{};
    var f=function(n){return n==null?"":String(n).replace(".",",")};
    rows.push([r.date,vname(v),plateTxt(v.plate),TYPES[r.type]||r.type,recTitle(r),r.workshop||r.station||r.company||"",f(r.km),f(r.liters),f(r.price),f(r.amount),r.ded?f(ivaOf(r)):"",r.expires||"",r.notes||""]);
  });
  download("mi-garage-gastos-"+iso(new Date())+".csv","﻿"+rows.map(function(r){return r.map(csvCell).join(";")}).join("\r\n"),"text/csv;charset=utf-8");
}
function onImportFile(file){
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var j=JSON.parse(rd.result);
      if(!j||!Array.isArray(j.vehicles)||!Array.isArray(j.records))throw new Error("formato");
      S.pending=j;
      openSheet(head("Importar copia")+'<p style="margin-top:12px">El archivo contiene <b>'+j.vehicles.length+' vehículos</b> y <b>'+j.records.length+' registros</b>.</p><p class="note" style="margin-top:12px">'+((S.vehicles.length||S.records.length)?'Esto sustituye los '+S.vehicles.length+' vehículos y '+S.records.length+' registros que tienes ahora.':'Aún no tienes datos, no se pierde nada.')+'</p><div class="row between" style="margin-top:16px"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="doimport">Importar</button></div>');
    }catch(e){toast("Ese archivo no es una copia válida de Mi Garage")}
  };
  rd.readAsText(file);
}
function doImport(){
  var j=S.pending;if(!j)return;
  S.vehicles=j.vehicles;S.records=j.records;S.settings=Object.assign({},j.settings||{},{lastBackup:S.settings.lastBackup});
  S.pending=null;persist();closeSheet();S.tab="resumen";S.vid=null;render(true);toast("Datos importados");
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t)return;
  var a=t.getAttribute("data-act"),d=t.dataset;
  if(a==="veil"){if(e.target===t)closeSheet();return}
  if(a==="demo")enterDemo();
  else if(a==="leave")leave();
  else if(a==="forgot"){
    openSheet(head("Restablecer acceso")+'<p style="margin-top:12px">Se borrarán la contraseña y todos los datos guardados en este dispositivo. Después podrás crear un acceso nuevo e importar tu copia de seguridad.</p><div class="row between" style="margin-top:16px"><button class="btn" data-act="close">Cancelar</button><button class="btn danger" data-act="doreset">Borrar y restablecer</button></div>');
  }
  else if(a==="doreset"){try{localStorage.removeItem(AUTH);localStorage.removeItem(KEY);localStorage.removeItem(REM);sessionStorage.removeItem(SESS)}catch(x){}closeSheet();S.mode="setup";S.authErr="";render(true)}
  else if(a==="tab"){S.tab=d.tab;S.vid=null;render(true);window.scrollTo(0,0)}
  else if(a==="openveh"){S.vid=d.id;render(true);window.scrollTo(0,0)}
  else if(a==="back"){S.vid=null;render(true)}
  else if(a==="newveh")vehForm();
  else if(a==="editveh")vehForm(veh(d.id));
  else if(a==="newrec"){if(!S.vehicles.length){vehForm();return}recForm(recDefaults(d.type,d.vid||S.vid))}
  else if(a==="renew"){var r=recDefaults(d.type,d.vid);if(d.type==="impuesto")r.title="Impuesto de circulación";recForm(r)}
  else if(a==="editrec"){var rec=S.records.find(function(x){return x.id===d.id});if(rec)recForm(Object.assign({},rec))}
  else if(a==="rtype"){var cur=readRec();S.draft.r=Object.assign({},S.draft.r,cur,{type:d.t});if(d.t==="impuesto"&&!S.draft.r.title)S.draft.r.title="Impuesto de circulación";drawRec()}
  else if(a==="newplan")planForm(d.vid);
  else if(a==="editplan"){var vv=veh(d.vid),p=(vv.plan||[]).find(function(x){return x.id===d.pid});if(p)planForm(d.vid,p)}
  else if(a==="plandone"){var v2=veh(d.vid),p2=(v2.plan||[]).find(function(x){return x.id===d.pid});if(p2){var r3=recDefaults("taller",d.vid);r3.title=p2.t;recForm(r3,{planId:p2.id})}}
  else if(a==="delplan"){
    if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="Confirmar eliminación";return}
    var v3=veh(S.draft.vid);saveItem("vehicles",Object.assign({},v3,{plan:(v3.plan||[]).filter(function(x){return x.id!==S.draft.pid})}));closeSheet();toast("Eliminada");
  }
  else if(a==="ft"){S.ft=d.t;render()}
  else if(a==="close")closeSheet();
  else if(a==="lookup")lookupInForm(t);
  else if(a==="lookupsaved")lookupSaved(d.id,t);
  else if(a==="autodoc"){
    var pe=$("f-plate"),pl=(pe?pe.value:(veh(S.vid)||{}).plate||"").toUpperCase().replace(/[\s-]/g,"");
    try{if(pl&&navigator.clipboard)navigator.clipboard.writeText(pl).catch(function(){})}catch(x){}
    window.open("https://www.autodoc.es/","_blank","noopener");
    toast(pl?"Matrícula "+pl+" copiada: pégala en la búsqueda de autodoc.es":"Escribe la matrícula en la búsqueda de autodoc.es");
  }
  else if(a==="setkey")openKeySheet();
  else if(a==="delkey"){try{localStorage.removeItem(APIKEY)}catch(x){}closeSheet();toast("Clave eliminada");render()}
  else if(a==="exportjson")exportJSON();
  else if(a==="exportcsv")exportCSV();
  else if(a==="importpick")$("impFile").click();
  else if(a==="doimport")doImport();
  else if(a==="chpass"){
    openSheet(head("Cambiar contraseña")+'<form id="cf" novalidate>'+'<div class="f"><label for="c-old">Contraseña actual</label><input id="c-old" type="password" autocomplete="current-password"></div><div class="f"><label for="c-new">Contraseña nueva</label><input id="c-new" type="password" autocomplete="new-password"></div><div class="err" id="c-err" role="alert"></div><div class="row between"><button type="button" class="btn" data-act="close">Cancelar</button><button type="submit" class="btn primary">Cambiar</button></div></form>');
  }
  else if(a==="wipe"){
    openSheet(head("Borrar todos los datos")+'<p style="margin-top:12px">Se eliminarán '+S.vehicles.length+' vehículos y '+S.records.length+' registros de este dispositivo. No se puede deshacer; descarga antes una copia si la quieres.</p><div class="row between" style="margin-top:16px"><button class="btn" data-act="close">Cancelar</button><button class="btn danger" data-act="dowipe">Borrar todo</button></div>');
  }
  else if(a==="dowipe"){S.vehicles=[];S.records=[];S.settings={};persist();closeSheet();S.vid=null;render(true);toast("Datos borrados")}
  else if(a==="delrec"||a==="delveh"){
    if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="Confirmar eliminación";return}
    if(a==="delrec")delItem("records",S.draft.id);
    else{var id=S.draft.id;recsOf(id).forEach(function(x){delItem("records",x.id)});delItem("vehicles",id);S.vid=null}
    closeSheet();toast("Eliminado");render();
  }
});
document.addEventListener("submit",function(e){
  e.preventDefault();var id=e.target.id;
  if(id==="af")submitAuth();
  else if(id==="vf")submitVeh();
  else if(id==="rf")submitRec();
  else if(id==="pf")submitPlan();
  else if(id==="kf"){var kv=$("k-key").value.trim();try{if(kv)localStorage.setItem(APIKEY,kv);else localStorage.removeItem(APIKEY)}catch(x){}closeSheet();toast(kv?"Clave guardada":"Clave eliminada");if(S.mode==="app")render()}
  else if(id==="cf"){
    (async function(){
      var a=getAuth(),old=$("c-old").value,nw=$("c-new").value,er=$("c-err");
      if(nw.length<6){er.textContent="La nueva contraseña debe tener al menos 6 caracteres.";return}
      if(await hashPw(old,a.salt)!==a.hash){er.textContent="La contraseña actual no es correcta.";return}
      var salt=newSalt();a.salt=salt;a.hash=await hashPw(nw,salt);localStorage.setItem(AUTH,JSON.stringify(a));closeSheet();toast("Contraseña cambiada");
    })();
  }
});
document.addEventListener("change",function(e){
  if(e.target.id==="fVeh"){S.fv=e.target.value;render();return}
  if(e.target.id==="impFile"){var f=e.target.files&&e.target.files[0];if(f)onImportFile(f);e.target.value="";return}
  if(e.target.id==="f-vid"&&S.draft&&S.draft.kind==="rec"){var v=veh(e.target.value);S.draft.r=Object.assign({},S.draft.r,readRec(),{vid:e.target.value,km:v&&v.km!=null?v.km:""});drawRec()}
});
document.addEventListener("input",function(e){
  var id=e.target.id,g=function(i){var x=$(i);return x?num(x.value):null},set=function(i,v){var x=$(i);if(x)x.value=v};
  if(id==="f-liters"||id==="f-price"){var l=g("f-liters"),p=g("f-price");if(l!=null&&p!=null)set("f-amount",String(r2(l*p)).replace(".",","))}
  if(id==="f-labor"||id==="f-parts"){var a=g("f-labor"),b=g("f-parts");if(a!=null||b!=null)set("f-amount",String(r2((a||0)+(b||0))).replace(".",","))}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&S.sheet)closeSheet()});

/* ---------- start ---------- */
(function(){
  var a=getAuth(),auto=false;
  try{auto=!!a&&(localStorage.getItem(REM)==="1"||sessionStorage.getItem(SESS)==="1")}catch(e){}
  if(auto){S.name=a.name||"";enter()}

  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
})();
})();
